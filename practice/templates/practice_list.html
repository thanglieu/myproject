<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Danh sách Practice</h2>

    <div class="mb-3">
        <a href="{% url 'practice:create' %}" class="btn btn-success">+ Tạo Practice mới</a>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Tiêu đề</th>
                <th>Tác giả</th>
                <th>Nội dung</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            {% for p in practices %}
            <tr>
                <td>
                    <a href="{% url 'practice:user_practice_list' p.id %}">{{ p.title }}</a>
                </td>
                <td>{{ p.author }}</td>
                <td>{{ p.content|truncatewords:20 }}</td>
                <td>
                    <a href="{% url 'practice:take_practice' p.id %}" class="btn btn-sm btn-primary">Làm</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">Chưa có Practice nào</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
