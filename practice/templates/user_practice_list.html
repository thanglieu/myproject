<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UserPractice List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Danh sách UserPractice cho: {{ practice.title }}</h2>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>User</th>
                <th>Mark</th>
                <th>Chi tiết</th>
            </tr>
        </thead>
        <tbody>
            {% for up in user_practices %}
            <tr>
                <td>{{ up.user.username }}</td>
                <td>{{ up.mark }}</td>
                <td>
                    <a href="{% url 'practice:user_practice' practice.id up.user.id %}" 
                       class="btn btn-sm btn-primary">Xem code</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">Chưa có UserPractice nào</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    
    <div class="mb-3">
        <a href="{% url 'practice:practice_list' %}" class="btn btn-secondary">← Quay về danh sách Practice</a>
    </div>

</body>
</html>
